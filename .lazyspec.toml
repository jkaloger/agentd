[naming]
pattern = "{type}-{n:03}-{title}.md"

[templates]
dir = ".lazyspec/templates"

[[relationships]]
name = "implements"
inverse = "implemented-by"
traversal = "chain"

[[relationships]]
name = "supersedes"
inverse = "superseded-by"

[[relationships]]
name = "blocks"
inverse = "blocked-by"

[[relationships]]
name = "related-to"
traversal = "related"

[tui]
ascii_diagrams = false

[tui.statusbar]
enabled = true

[tui.multiline]
max_expanded_height = 5

[tui.graph]
columns = [
    "status",
    "related",
]
sort = "path"

[[rules]]
shape = "relation-existence"
name = "iterations-need-work"
type = "iteration"
require = "any-relation"
severity = "error"

[[rules]]
shape = "relation-existence"
name = "adrs-need-relations"
type = "adr"
require = "any-relation"
severity = "error"

[certification]
normalize = true

[certification.overrides]

[agents]

[skills]
entry = "lazy"

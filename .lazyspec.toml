[[types]]
name = "story"
plural = "stories"
dir = "docs/stories"
prefix = "STORY"
icon = "▲"
intent = "Capture one unit of user-facing value as a written, testable requirement with acceptance criteria."
numbering = "incremental"
subdirectory = false
store = "filesystem"
singleton = false
agents = []
authorship = "assisted"
attributes = []

[types.lifecycle]
states = [
    "draft",
    "review",
    "accepted",
    "in-progress",
    "complete",
    "rejected",
    "superseded",
]

[[types.lifecycle.edges]]
from = "draft"
to = "review"

[[types.lifecycle.edges]]
from = "review"
to = "accepted"

[[types.lifecycle.edges]]
from = "review"
to = "rejected"

[[types.lifecycle.edges]]
from = "accepted"
to = "in-progress"

[[types.lifecycle.edges]]
from = "in-progress"
to = "complete"

[[types.lifecycle.edges]]
from = "*"
to = "superseded"

[[types]]
name = "bug"
plural = "bugs"
dir = "docs/bugs"
prefix = "BUG"
icon = "🐛"
intent = "Report an observed defect — expected vs actual with repro steps — and track it to resolution."
numbering = "incremental"
subdirectory = false
store = "filesystem"
singleton = false
agents = []
authorship = "assisted"
attributes = []

[types.lifecycle]
states = [
    "reported",
    "triaged",
    "in-progress",
    "fixed",
    "wontfix",
]

[[types.lifecycle.edges]]
from = "reported"
to = "triaged"

[[types.lifecycle.edges]]
from = "triaged"
to = "in-progress"

[[types.lifecycle.edges]]
from = "in-progress"
to = "fixed"

[[types.lifecycle.edges]]
from = "reported"
to = "wontfix"

[[types.lifecycle.edges]]
from = "triaged"
to = "wontfix"

